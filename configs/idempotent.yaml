kafka:
  brokers:
    - localhost:9092
  client_id: kafka-practise-idempotent-producer
  version: 3.6.0
  producer:
    required_acks: all
    retry_max: 5
    return_successes: true
    idempotent: true
  consumer:
    group_id: kafka-practise-group
    offset_initial: oldest
    auto_commit: false
  tls:
    enabled: false
  sasl:
    enabled: false

